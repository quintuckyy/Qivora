# Production overrides. Use together with the base file, which disables the
# automatic docker-compose.override.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this layer changes:
#   - Postgres is never published to a host port (already true in the base file;
#     this layer just makes the required-secret failure loud).
#   - Every production secret becomes required (`:?`) instead of falling back to
#     a dev default.
#   - NODE_ENV=production (tightens CORS to the FRONTEND_ORIGIN allowlist) and
#     Swagger UI is turned off.
#
# This compose file still terminates plain HTTP. Put a TLS-terminating reverse
# proxy (Caddy / Traefik / nginx + certbot) or a platform load balancer in
# front of the `frontend` and `backend` ports — see DEPLOYMENT.md.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD (openssl rand -base64 24)}

  backend:
    environment:
      NODE_ENV: production
      ENABLE_SWAGGER: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-jobtracker}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET (openssl rand -base64 48)}
      # Comma-separated. The deployed web app origin, plus the published browser
      # extension origin (chrome-extension://<id>) if you ship the extension.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to your deployed web app origin}

  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL to the public backend URL the browser will call}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
