services:
  postgres:
    image: postgres:17
    container_name: job_tracker_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}

    # No published port by default — the database is reachable only from other
    # services on the internal `job-tracker` network. docker-compose.override.yml
    # re-exposes it on 127.0.0.1 for local development (psql, Prisma Studio,
    # e2e tests); that override is NOT loaded when you pass explicit -f flags,
    # so the production command never publishes it. See DEPLOYMENT.md.

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - job-tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_tracker_backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-jobtracker}@postgres:5432/${POSTGRES_DB:-jobtracker}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file at the repo root (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      # Must match the URL the browser actually uses to reach the frontend container
      # (see FRONTEND_PORT below) — the backend's CORS check is browser-origin-based.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # Gmail email sync — optional. Blank/unset GOOGLE_CLIENT_ID disables the
      # feature without affecting anything else (see backend/.env.example).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5173/email-sync}
      EMAIL_SYNC_ENCRYPTION_KEY: ${EMAIL_SYNC_ENCRYPTION_KEY:-}
      # Transactional email (password reset) — optional. Blank/unset
      # BREVO_API_KEY disables real sending without affecting anything else
      # (see backend/.env.example).
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      - backend_uploads:/app/uploads

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    networks:
      - job-tracker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — must be a URL the browser can
        # reach, not a Docker-internal hostname like http://backend:3000.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        # "Continue with Google" — same OAuth client ID as the backend's
        # GOOGLE_CLIENT_ID (see backend's environment block below). Not a
        # secret. Blank leaves the login page's Google button disabled.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: job_tracker_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    networks:
      - job-tracker

volumes:
  postgres_data:
  backend_uploads:

networks:
  job-tracker:
    driver: bridge
